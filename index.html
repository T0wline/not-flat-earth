<style>
/* Layout: one column. Viewfinder first, then live readouts, then the two place pickers. */
:root{
  --bg:#edf1f1; --surface:#f8fafa; --fg:#122124; --muted:#566a6d; --line:#cdd8d9;
  --you:#0e7a68; --there:#c24d24; --path:#a8650a;
  --display:'Bricolage Grotesque',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1517; --surface:#162123; --fg:#e3eced; --muted:#8ea5a8; --line:#2a3c3f;
    --you:#3cc3a6; --there:#f08b63; --path:#f0b24c; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1517; --surface:#162123; --fg:#e3eced; --muted:#8ea5a8; --line:#2a3c3f;
  --you:#3cc3a6; --there:#f08b63; --path:#f0b24c; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 var(--body);
  padding-block:12px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:16px}
h1{font:700 28px/1.1 var(--display); letter-spacing:-.01em; margin:0; text-wrap:balance}
.sub{margin:6px 0 0; color:var(--muted); max-width:46ch}
.stage{
  position:relative; width:100%; aspect-ratio:3/4; max-height:72svh;
  border-radius:14px; overflow:hidden; background:#20302f; border:1px solid var(--line);
}
.stage video,.stage canvas{position:absolute; inset:0; width:100%; height:100%}
.stage video{object-fit:cover}
.stage canvas{touch-action:none; cursor:grab}
.status{margin:0; color:var(--muted); font-size:14px; min-height:42px}
.actions{display:flex; flex-direction:column; gap:12px}
.btn{
  font:inherit; font-weight:500; min-height:44px; padding:0 16px; border-radius:10px;
  border:1px solid var(--line); background:var(--surface); color:var(--fg); cursor:pointer;
}
.btn.primary{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.btn:focus-visible,input:focus-visible,.opt:focus-visible{outline:2px solid var(--path); outline-offset:2px}
.nudge{display:flex; align-items:center; gap:10px; font-size:14px; color:var(--muted)}
.nudge input{flex:1; min-width:0; accent-color:var(--path)}
.nudge output{min-width:3.5ch; text-align:right; font-variant-numeric:tabular-nums; color:var(--fg)}
.read{display:grid; grid-template-columns:1fr 1fr; margin:0; border-top:1px solid var(--line)}
.read>div{padding:12px 0; border-bottom:1px solid var(--line); min-width:0}
.read>div:nth-child(odd){padding-right:12px; border-right:1px solid var(--line)}
.read>div:nth-child(even){padding-left:16px}
dt{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
dd{margin:2px 0 0; font:500 24px/1.2 var(--display); font-variant-numeric:tabular-nums}
.places{display:flex; flex-direction:column; gap:16px}
.place label{display:flex; align-items:center; gap:8px; font-weight:500; margin-bottom:6px}
.dot{width:10px; height:10px; border-radius:50%; flex:none}
.field{display:flex; gap:8px}
.field input{
  flex:1; min-width:0; min-height:44px; padding:0 12px; font:inherit; color:var(--fg);
  background:var(--surface); border:1px solid var(--line); border-radius:10px;
}
.sug{list-style:none; margin:6px 0 0; padding:0; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--surface)}
.sug li+li{border-top:1px solid var(--line)}
.opt{display:block; width:100%; text-align:left; font:inherit; color:inherit; background:none; border:0; padding:10px 12px; min-height:44px; cursor:pointer}
.opt:hover{background:var(--bg)}
.opt small{display:block; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.hint{padding:10px 12px; font-size:13px; color:var(--muted)}
.coords{margin:6px 0 0; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
.swap{align-self:flex-start}
.units{display:flex; align-self:flex-start; border:1px solid var(--line); border-radius:10px; overflow:hidden}
.units button{font:inherit; font-weight:500; min-height:40px; min-width:60px; padding:0 14px; background:var(--surface); color:var(--muted); border:0; cursor:pointer}
.units button+button{border-left:1px solid var(--line)}
.units button[aria-pressed="true"]{background:var(--fg); color:var(--bg)}
.units button:focus-visible{outline:2px solid var(--path); outline-offset:-2px}
@media (prefers-reduced-motion:no-preference){.btn{transition:background .15s}}

<div class="wrap">
  <header>
    <h1>(Not) Flat Earth</h1>
    <p class="sub">Point your phone at anywhere on Earth. The marker shows where it is, straight through the ground.</p>
  </header>

  <section class="stage" id="stage">
    <video id="cam" playsinline muted hidden></video>
    <canvas id="view" role="img" aria-label="Viewfinder showing the direction to the chosen place"></canvas>
  </section>
  <p class="status" id="status" role="status">Drag to look around, or switch on your camera and compass.</p>

  <div class="actions">
    <button class="btn primary" id="live" type="button">Use camera and compass</button>
    <label class="nudge" id="nudge" hidden>
      <span>Compass nudge</span>
      <input id="offset" type="range" min="-30" max="30" step="1" value="0">
      <output id="offsetOut" for="offset">0°</output>
    </label>
  </div>

  <div class="units" id="units" role="group" aria-label="Distance unit">
    <button type="button" data-u="km" aria-pressed="true">km</button>
    <button type="button" data-u="nm" aria-pressed="false">nm</button>
    <button type="button" data-u="mi" aria-pressed="false">miles</button>
  </div>

  <dl class="read">
    <div><dt>Heading</dt><dd id="rAz">—</dd></div>
    <div><dt>Tilt</dt><dd id="rEl">—</dd></div>
    <div><dt>Straight through</dt><dd id="rChord">—</dd></div>
    <div><dt>Over the surface</dt><dd id="rSurf">—</dd></div>
  </dl>

  <section class="places">
    <div class="place">
      <label for="fromQ"><span class="dot" style="background:var(--you)"></span>You are at</label>
      <div class="field">
        <input id="fromQ" type="text" autocomplete="off" enterkeyhint="search" placeholder="Search any place">
        <button class="btn" id="gps" type="button">Use GPS</button>
      </div>
      <ul class="sug" id="fromSug" hidden></ul>
      <p class="coords" id="fromCoords"></p>
    </div>
    <div class="place">
      <label for="toQ"><span class="dot" style="background:var(--there)"></span>Pointing at</label>
      <div class="field">
        <input id="toQ" type="text" autocomplete="off" enterkeyhint="search" placeholder="Search any place">
      </div>
      <ul class="sug" id="toSug" hidden></ul>
      <p class="coords" id="toCoords"></p>
    </div>
    <button class="btn swap" id="swap" type="button">Swap places</button>
  </section>
</div>

<script>
(function(){
'use strict';
//<math>
const D2R=Math.PI/180, WA=6378137, WF=1/298.257223563, WE2=WF*(2-WF), RM=6371008.8;
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
function ecef(lat,lon){
  const p=lat*D2R,l=lon*D2R,s=Math.sin(p),N=WA/Math.sqrt(1-WE2*s*s);
  return [N*Math.cos(p)*Math.cos(l),N*Math.cos(p)*Math.sin(l),N*(1-WE2)*s];
}
function aim(from,to){
  const a=ecef(from.lat,from.lon),b=ecef(to.lat,to.lon);
  const dx=b[0]-a[0],dy=b[1]-a[1],dz=b[2]-a[2];
  const p=from.lat*D2R,l=from.lon*D2R,sp=Math.sin(p),cp=Math.cos(p),sl=Math.sin(l),cl=Math.cos(l);
  const e=-sl*dx+cl*dy, n=-sp*cl*dx-sp*sl*dy+cp*dz, u=cp*cl*dx+cp*sl*dy+sp*dz;
  const d=Math.hypot(e,n,u), h=Math.hypot(e,n);
  return {az:(Math.atan2(e,n)/D2R+360)%360, el:Math.atan2(u,h)/D2R, chordKm:d/1000, dir:d>1?[e/d,n/d,u/d]:null};
}
function surfaceKm(a,b){
  const p1=a.lat*D2R,p2=b.lat*D2R,dp=p2-p1,dl=(b.lon-a.lon)*D2R;
  const h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2*RM*Math.asin(Math.min(1,Math.sqrt(h)))/1000;
}
function basisFromEuler(alpha,beta,gamma){
  const cA=Math.cos(alpha*D2R),sA=Math.sin(alpha*D2R),cB=Math.cos(beta*D2R),sB=Math.sin(beta*D2R),cG=Math.cos(gamma*D2R),sG=Math.sin(gamma*D2R);
  return {
    f:[-cA*sG-sA*sB*cG, -sA*sG+cA*sB*cG, -cB*cG],
    u:[-sA*cB, cA*cB, sB],
    r:[cA*cG-sA*sB*sG, sA*cG+cA*sB*sG, -cB*sG]
  };
}

  const a=az*D2R,p=pitch*D2R,sa=Math.sin(a),ca=Math.cos(a),sp=Math.sin(p),cp=Math.cos(p);
  return {f:[sa*cp,ca*cp,sp], r:[ca,-sa,0], u:[-sa*sp,-ca*sp,cp]};
}

  const zc=dot(d,b.f),xc=dot(d,b.r),yc=dot(d,b.u),ok=zc>1e-6;
  return {zc:zc,xc:xc,yc:yc,x:ok?cx+F*xc/zc:NaN,y:ok?cy-F*yc/zc:NaN};
}
//</math>

const PLACES=`Space Needle, Seattle|47.6205|-122.3493

const $=function(id){return document.getElementById(id);};
const root=document.documentElement;
const nf=new Intl.NumberFormat('en-GB',{maximumFractionDigits:0});
const BODY='"IBM Plex Sans",system-ui,sans-serif';
const cv=$('view'),ctx=cv.getContext('2d'),cam=$('cam'),stage=$('stage');
const statusEl=$('status');

function loadSaved(){try{return JSON.parse(localStorage.getItem('earthlens'))||{};}catch(e){return {};}}
function saveState(){try{localStorage.setItem('earthlens',JSON.stringify({from:from,to:to,unit:unit}));}catch(e){}}
function valid(p){return p&&typeof p.name==='string'&&isFinite(p.lat)&&isFinite(p.lon)&&Math.abs(p.lat)<=90&&Math.abs(p.lon)<=180;}
const saved=loadSaved();
let from=valid(saved.from)?saved.from:{name:'Space Needle, Seattle',lat:47.6205,lon:-122.3493};
let to=valid(saved.to)?saved.to:{name:'New York',lat:40.7128,lon:-74.0060};

const UF={km:1,nm:0.539956803,mi:0.621371192},UL={km:'km',nm:'nm',mi:'miles'};
let unit=UF[saved.unit]?saved.unit:'km';
function fmtDist(km){const v=km*UF[unit];return (v<100?v.toFixed(1):nf.format(v))+' '+UL[unit];}
let A=null,S=0;
let live=false,camOn=false,got=false,absSeen=false,headingOk=false;
let offset=0,yaw=0,pitch=0,dpr=1,raf=0;
const sm={alpha:0,beta:90,gamma:0};

function setStatus(t){statusEl.textContent=t;}
function compass(az){return ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round(az/22.5)%16];}
function fmtCoord(p){return Math.abs(p.lat).toFixed(4)+'° '+(p.lat>=0?'N':'S')+', '+Math.abs(p.lon).toFixed(4)+'° '+(p.lon>=0?'E':'W');}
function shortName(n){return n.length>26?n.slice(0,25)+'…':n;}

function schedule(){if(!raf)raf=requestAnimationFrame(function(){raf=0;draw();});}

function recompute(){
  A=aim(from,to);S=surfaceKm(from,to);
  if(A.dir){
    $('rAz').textContent=Math.round(A.az)+'° '+compass(A.az);
    $('rEl').textContent=Math.abs(A.el).toFixed(1)+'° '+(A.el<=0?'down':'up');
    $('rChord').textContent=fmtDist(A.chordKm);
    $('rSurf').textContent=fmtDist(S);
  }else{
    $('rAz').textContent='—';$('rEl').textContent='—';$('rChord').textContent=fmtDist(0);$('rSurf').textContent=fmtDist(0);
  }
  $('fromCoords').textContent=fmtCoord(from);
  $('toCoords').textContent=fmtCoord(to);
  if(!live&&A.dir){yaw=A.az-12;pitch=Math.max(A.el+12,-85);}
  saveState();schedule();
}

function cssVar(n){return getComputedStyle(root).getPropertyValue(n).trim();}

  ctx.clearRect(0,0,W,H);

  const youC=cssVar('--you'),thereC=cssVar('--there');

    ctx.fillStyle='#bcd6e8';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#587a52';

  ctx.beginPath();ctx.moveTo(cx-9,cy);ctx.lineTo(cx+9,cy);ctx.moveTo(cx,cy-9);ctx.lineTo(cx,cy+9);ctx.stroke();

  function pill(text,x,y){
    ctx.font='500 13px '+BODY;ctx.textAlign='left';ctx.textBaseline='middle';
    const w=ctx.measureText(text).width+20,h=26;

  const camAz=Math.atan2(b.f[0],b.f[1])/D2R,camEl=Math.asin(Math.max(-1,Math.min(1,b.f[2])))/D2R;
  const dAz=((A.az-camAz+540)%360)-180,dEl=A.el-camEl,hint=[];
  if(Math.abs(dAz)>3)hint.push('turn '+(dAz>0?'right ':'left ')+Math.round(Math.abs(dAz))+'°');
  if(Math.abs(dEl)>3)hint.push('tilt '+(dEl<0?'down ':'up ')+Math.round(Math.abs(dEl))+'°');
  pill(hint.length?hint.join(' · '):'On target',cx,24);
}

(function(){
  let drag=null;
  cv.addEventListener('pointerdown',function(e){if(live)return;drag={x:e.clientX,y:e.clientY};try{cv.setPointerCapture(e.pointerId);}catch(x){}});
  cv.addEventListener('pointermove',function(e){
    if(!drag)return;
    const k=60/cv.clientHeight;
    yaw=((yaw-(e.clientX-drag.x)*k)%360+360)%360;
    pitch=Math.max(-89,Math.min(89,pitch+(e.clientY-drag.y)*k));
    drag={x:e.clientX,y:e.clientY};schedule();
  });
  ['pointerup','pointercancel'].forEach(function(n){cv.addEventListener(n,function(){drag=null;});});
})();

new ResizeObserver(function(){
  dpr=Math.min(window.devicePixelRatio||1,3);
  cv.width=Math.round(cv.clientWidth*dpr);cv.height=Math.round(cv.clientHeight*dpr);schedule();
}).observe(stage);

function onOri(e){
  if(e.type==='deviceorientationabsolute'){absSeen=true;headingOk=true;}
  else if(absSeen)return;
  let a=e.alpha;const b=e.beta,g=e.gamma;
  if(typeof e.webkitCompassHeading==='number'){a=360-e.webkitCompassHeading;headingOk=true;}
  else if(e.absolute===true)headingOk=true;
  if(a==null||b==null||g==null)return;
  if(!got){sm.alpha=a;sm.beta=b;sm.gamma=g;got=true;}
  else{
    const k=.3,da=((a-sm.alpha+540)%360)-180;
    sm.alpha=(sm.alpha+da*k+360)%360;sm.beta+=(b-sm.beta)*k;sm.gamma+=(g-sm.gamma)*k;
  }
  live=true;schedule();
}

async function goLive(){
  setStatus('Asking for camera and motion…');
  const DOE=window.DeviceOrientationEvent;
  let motionDenied=false;
  try{
    if(DOE&&typeof DOE.requestPermission==='function'){
      const r=await DOE.requestPermission();
      if(r!=='granted')motionDenied=true;
    }
  }catch(err){motionDenied=true;}
  if(!motionDenied){
    window.addEventListener('deviceorientationabsolute',onOri);
    window.addEventListener('deviceorientation',onOri);
  }
  try{
    const md=navigator.mediaDevices;
    if(!md||!md.getUserMedia)throw new Error('no camera');
    const s=await md.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    cam.srcObject=s;await cam.play();cam.hidden=false;camOn=true;
  }catch(err){camOn=false;}
  await new Promise(function(r){setTimeout(r,1200);});
  if(live&&camOn){
    setStatus(headingOk?'Live. Follow the hint at the top of the view.':'Live, but this phone gives no compass heading. Use the nudge to line the marker up.');
    $('live').hidden=true;$('nudge').hidden=false;
  }else if(live){
    setStatus('Motion works, but the camera is blocked here, so you get the demo sky behind the marker.');
    $('nudge').hidden=false;
  }else if(camOn){
    setStatus('The camera is on, but no motion data arrived. Drag to look around.');
  }else{
    setStatus('This view blocks the camera and compass, so you are still on the demo scene. Open the page from its own https address on your phone to use them.');
  }
  schedule();
}
$('live').addEventListener('click',goLive);
$('offset').addEventListener('input',function(e){offset=+e.target.value;$('offsetOut').textContent=(offset>0?'+':'')+offset+'°';schedule();});

let remoteDown=false;
function norm(s){return s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();}
async function search(q){
  q=q.trim();
  if(q.length<2)return [];
  const out=[];
  const m=q.match(/^\s*(-?\d{1,2}(?:\.\d+)?)\s*[,;\s]\s*(-?\d{1,3}(?:\.\d+)?)\s*$/);
  if(m&&Math.abs(+m[1])<=90&&Math.abs(+m[2])<=180){
    out.push({name:'Coordinates '+(+m[1])+', '+(+m[2]),detail:'Exact point',lat:+m[1],lon:+m[2]});
  }
  const nq=norm(q);
  PLACES.filter(function(p){return norm(p.name).includes(nq);}).slice(0,5).forEach(function(p){
    out.push({name:p.name,detail:'Built-in place',lat:p.lat,lon:p.lon});
  });
  try{
    const ctrl=new AbortController(),t=setTimeout(function(){ctrl.abort();},4000);
    const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&q='+encodeURIComponent(q),{signal:ctrl.signal});
    clearTimeout(t);
    if(!r.ok)throw new Error('bad status');
    const j=await r.json();remoteDown=false;
    j.forEach(function(x){
      const parts=String(x.display_name).split(', ');
      const name=parts.length>1?parts[0]+', '+parts[parts.length-1]:parts[0];
      if(out.some(function(o){return Math.abs(o.lat-(+x.lat))<0.05&&Math.abs(o.lon-(+x.lon))<0.05;}))return;
      out.push({name:name,detail:x.display_name,lat:+x.lat,lon:+x.lon});
    });
  }catch(err){remoteDown=true;}
  return out;
}

function wirePicker(key){
  const q=$(key+'Q'),list=$(key+'Sug');
  let seq=0,timer=0,items=[];
  function pick(it){
    const p={name:it.name,lat:it.lat,lon:it.lon};
    if(key==='from')from=p;else to=p;
    q.value=p.name;list.hidden=true;items=[];recompute();
  }
  function render(typed){
    list.textContent='';
    items.forEach(function(it){
      const li=document.createElement('li'),bt=document.createElement('button');
      bt.type='button';bt.className='opt';bt.textContent=it.name;
      const sm2=document.createElement('small');sm2.textContent=it.detail;bt.appendChild(sm2);
      bt.addEventListener('click',function(){pick(it);});
      li.appendChild(bt);list.appendChild(li);
    });
    if(remoteDown||!items.length){
      const li=document.createElement('li');li.className='hint';
      li.textContent=items.length?'Online place search is not available here, so these are built-in places.':
        (remoteDown?'No built-in match. Try a big city nearby, or type coordinates like 51.5, -0.12.':'No match. Try a different spelling.');
      list.appendChild(li);
    }
    list.hidden=false;
  }
  q.addEventListener('input',function(){
    clearTimeout(timer);
    if(q.value.trim().length<2){list.hidden=true;return;}
    timer=setTimeout(async function(){
      const my=++seq,res=await search(q.value);
      if(my!==seq)return;
      items=res;render();
    },300);
  });
  q.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&items.length){e.preventDefault();pick(items[0]);}
    if(e.key==='Escape')list.hidden=true;
  });
  q.addEventListener('focus',function(){q.select();});
  q.addEventListener('blur',function(){setTimeout(function(){list.hidden=true;},150);});
  list.addEventListener('mousedown',function(e){e.preventDefault();});
  q.value=(key==='from'?from:to).name;
}
wirePicker('from');wirePicker('to');

$('swap').addEventListener('click',function(){
  const t=from;from=to;to=t;$('fromQ').value=from.name;$('toQ').value=to.name;recompute();
});

$('gps').addEventListener('click',function(){
  if(!navigator.geolocation){setStatus('This browser has no location access. Search for where you are instead.');return;}
  setStatus('Finding you…');
  try{
    navigator.geolocation.getCurrentPosition(function(pos){
      from={name:'My location',lat:pos.coords.latitude,lon:pos.coords.longitude};
      $('fromQ').value=from.name;recompute();
      setStatus('Got your location.');
    },function(){
      setStatus('Location is blocked here. Search for where you are instead.');
    },{enableHighAccuracy:true,timeout:10000,maximumAge:30000});
  }catch(err){setStatus('Location is blocked here. Search for where you are instead.');}
});

  unit=u;
  document.querySelectorAll('#units button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.u===u));});
  recompute();
}
document.querySelectorAll('#units button').forEach(function(b){b.addEventListener('click',function(){setUnit(b.dataset.u);});});
setUnit(unit);
